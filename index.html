  <style>
    :root {
      --ink: #111827;
      --muted: #667085;
      --line: #e6e8ec;
      --panel: rgba(255,255,255,.78);
      --shadow: 0 18px 55px rgba(17,24,39,.08);
      --glow: 0 20px 70px rgba(255,120,84,.18);
      --orange: #f97316;
      --rose: #f43f5e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 16% 8%, rgba(255,122,89,.13), transparent 28rem),
        radial-gradient(circle at 88% 16%, rgba(77,149,255,.11), transparent 28rem),
        linear-gradient(180deg, #fafafa 0%, #f4f6f8 48%, #fff 100%);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .wrap { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
    .nav {
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid rgba(255,255,255,.74);
      background: rgba(255,255,255,.74);
      backdrop-filter: blur(22px);
    }
    .nav-inner {
      min-height: 70px;
      display: grid;
      grid-template-columns: auto minmax(220px, 520px) auto;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 0;
      background: transparent;
      padding: 0;
      text-align: left;
      color: var(--ink);
    }
    .mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: var(--ink);
      color: #fff;
      font-size: 18px;
      font-weight: 950;
      box-shadow: var(--shadow);
    }
    .brand strong { display: block; line-height: 1.1; }
    .brand small { display: block; color: var(--muted); font-size: 12px; }
    .top-search { position: relative; }
    .top-search input {
      width: 100%;
      height: 46px;
      border: 1px solid var(--line);
      outline: 0;
      border-radius: 999px;
      padding: 0 44px 0 42px;
      background: rgba(255,255,255,.88);
      color: var(--ink);
      font-weight: 650;
      box-shadow: 0 8px 26px rgba(17,24,39,.04);
    }
    .top-search span { position: absolute; left: 17px; top: 12px; color: #98a2b3; }
    .clear {
      display: none;
      position: absolute;
      right: 7px;
      top: 7px;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 999px;
      background: #f2f4f7;
      color: #667085;
    }
    .actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .pill, .lang button {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.78);
      color: #475467;
      font-size: 13px;
      font-weight: 800;
      transition: .2s ease;
    }
    .pill { padding: 10px 14px; }
    .pill:hover, .lang button:hover { transform: translateY(-1px); background: #fff; }
    .lang {
      display: flex;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px;
      background: rgba(255,255,255,.76);
    }
    .lang button { border: 0; background: transparent; padding: 7px 10px; }
    .lang button.active { background: var(--ink); color: #fff; }
    .hero { padding: 54px 0 26px; }
    .hero-inner { max-width: 860px; margin: 0 auto; text-align: center; }
    .eyebrow {
      display: inline-flex;
      margin-bottom: 22px;
      border: 1px solid #fff;
      border-radius: 999px;
      padding: 9px 14px;
      background: rgba(255,255,255,.74);
      color: var(--muted);
      font-size: 14px;
      font-weight: 850;
      box-shadow: 0 4px 14px rgba(17,24,39,.04);
    }
    h1 { margin: 0; font-size: clamp(38px, 7vw, 76px); line-height: 1.03; letter-spacing: 0; }
    .lead { max-width: 680px; margin: 22px auto 0; color: var(--muted); font-size: 18px; line-height: 1.8; }
    .toolbar { padding: 28px 0 14px; }
    .breadcrumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: #667085; font-size: 14px; font-weight: 750; }
    .breadcrumbs button { border: 0; background: transparent; color: #475467; font-weight: 850; padding: 4px; }
    .breadcrumbs button:hover { color: var(--ink); }
    .kicker { margin-top: 14px; color: var(--orange); font-size: 13px; font-weight: 950; letter-spacing: .18em; text-transform: uppercase; }
    h2 { margin: 6px 0 0; font-size: clamp(28px, 4vw, 44px); letter-spacing: 0; }
    .hint { color: var(--muted); line-height: 1.65; margin: 8px 0 0; }
    .directory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 18px 0 76px; }
    .directory-card {
      min-height: 168px;
      border: 1px solid #fff;
      border-radius: 28px;
      padding: 20px;
      background: var(--panel);
      box-shadow: 0 4px 16px rgba(17,24,39,.04);
      text-align: left;
      color: var(--ink);
      transition: .22s ease;
    }
    .directory-card:hover { transform: translateY(-4px); background: #fff; box-shadow: var(--shadow); }
    .directory-card .icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: var(--ink);
      color: #fff;
      margin-bottom: 16px;
      font-weight: 950;
    }
    .directory-card strong { display: block; font-size: 18px; letter-spacing: 0; }
    .directory-card p { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .directory-card small { display: block; margin-top: 16px; color: #98a2b3; font-weight: 850; }
    .tiers { padding-bottom: 84px; }
    .tier { margin-top: 34px; }
    .tier-top { display: flex; align-items: end; justify-content: space-between; margin-bottom: 12px; }
    .tier h3 { margin: 0; font-size: 28px; }
    .tier-count { color: var(--muted); font-size: 14px; font-weight: 800; }
    .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 22px;
      background: rgba(255,255,255,.82);
      box-shadow: var(--shadow);
      transition: .24s ease;
    }
    .card:hover { transform: translateY(-5px); }
    .rail { position: absolute; inset: 0 0 auto; height: 4px; }
    .badge { display: inline-flex; border-radius: 999px; padding: 6px 12px; color: #fff; font-size: 14px; font-weight: 950; }
    .hang { background: linear-gradient(135deg, rgba(255,255,255,.98), rgba(255,237,213,.76), rgba(255,228,230,.6)); border-color: rgba(254,215,170,.9); box-shadow: var(--glow); }
    .hang .rail, .hang .badge { background: linear-gradient(90deg, var(--orange), var(--rose)); }
    .top { background: linear-gradient(135deg, #fff, rgba(219,234,254,.7)); border-color: rgba(191,219,254,.9); }
    .top .rail, .top .badge { background: linear-gradient(90deg, #2563eb, #06b6d4); }
    .elite { background: linear-gradient(135deg, #fff, rgba(209,250,229,.7)); border-color: rgba(167,243,208,.9); }
    .elite .rail, .elite .badge { background: linear-gradient(90deg, #059669, #14b8a6); }
    .npc .rail, .npc .badge { background: linear-gradient(90deg, #64748b, #475569); }
    .trash { background: rgba(244,244,245,.82); opacity: .9; }
    .trash .rail, .trash .badge { background: linear-gradient(90deg, #52525b, #18181b); }
    .card-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .heart {
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.8);
      color: #98a2b3;
      font-size: 18px;
    }
    .heart.active { color: #f43f5e; background: #fff1f2; border-color: #fecdd3; }
    .meta { margin-top: 14px; color: var(--muted); font-size: 13px; font-weight: 800; }
    .name { margin-top: 4px; font-size: 21px; font-weight: 950; letter-spacing: 0; }
    .summary { min-height: 52px; color: var(--muted); line-height: 1.65; font-size: 14px; }
    .score-row { display: grid; grid-template-columns: 84px 1fr; gap: 16px; align-items: center; margin: 18px 0; }
    .score { width: 76px; height: 76px; display: grid; place-items: center; border-radius: 27px; background: rgba(255,255,255,.75); font-size: 30px; font-weight: 950; }
    .meter { margin: 10px 0; }
    .meter-label { display: flex; justify-content: space-between; margin-bottom: 5px; color: var(--muted); font-size: 12px; font-weight: 850; }
    .bar { height: 6px; overflow: hidden; border-radius: 999px; background: rgba(148,163,184,.25); }
    .fill { height: 100%; border-radius: inherit; background: var(--ink); }
    .audience-label { color: #98a2b3; text-transform: uppercase; letter-spacing: .16em; font-size: 11px; font-weight: 950; }
    .audience { margin-top: 4px; color: #344054; font-size: 14px; font-weight: 700; line-height: 1.55; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .tag { border: 1px solid #fff; border-radius: 999px; background: rgba(255,255,255,.66); padding: 6px 10px; color: #475467; font-size: 12px; font-weight: 850; }
    .quick-notes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    .quick-note {
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 18px;
      background: rgba(255,255,255,.54);
      padding: 10px;
      color: #475467;
      font-size: 12px;
      line-height: 1.55;
    }
    .quick-note strong {
      display: block;
      margin-bottom: 4px;
      color: var(--ink);
      font-size: 12px;
    }
    .detail-link { margin-top: 18px; display: flex; justify-content: space-between; font-size: 14px; font-weight: 950; }
    .empty { display: none; margin: 22px 0 80px; border: 1px solid var(--line); border-radius: 28px; background: rgba(255,255,255,.78); padding: 44px; text-align: center; color: var(--muted); box-shadow: var(--shadow); }
    .modal { display: none; position: fixed; inset: 0; z-index: 50; align-items: center; justify-content: center; padding: 18px; background: rgba(17,24,39,.28); backdrop-filter: blur(12px); }
    .modal.show { display: flex; }
    .dialog { width: min(920px, 100%); max-height: min(760px, calc(100vh - 36px)); overflow: auto; border: 1px solid #fff; border-radius: 34px; background: rgba(255,255,255,.94); box-shadow: 0 30px 90px rgba(17,24,39,.24); padding: 26px; }
    .dialog-top { display: flex; justify-content: space-between; gap: 16px; align-items: start; }
    .close { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
    .dialog h2 { margin: 12px 0 0; font-size: 36px; }
    .dialog-summary { color: var(--muted); line-height: 1.75; }
    .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 22px; }
    .info { border: 1px solid var(--line); border-radius: 22px; background: #fff; padding: 16px; color: var(--muted); line-height: 1.65; font-size: 14px; }
    .info strong { display: block; margin-bottom: 8px; color: var(--ink); font-size: 17px; }
    .info ul { margin: 0; padding-left: 18px; }
    @media (max-width: 940px) {
      .nav-inner { grid-template-columns: 1fr; }
      .actions { justify-content: flex-start; overflow-x: auto; }
      .directory-grid, .product-grid { grid-template-columns: repeat(2, 1fr); }
      .info-grid { grid-template-columns: 1fr; }
      .hero-inner { text-align: left; }
      .lead { margin-left: 0; }
    }
    @media (max-width: 640px) {
      .pill { display: none; }
      .directory-grid, .product-grid { grid-template-columns: 1fr; }
      .hero { padding-top: 38px; }
      .directory-card { min-height: auto; }
      .dialog { border-radius: 26px; padding: 18px; }
      .dialog h2 { font-size: 28px; }
    }
  </style>

        score,
        valueScore,
        qualityScore,
        name: { zh, en, ja },
        summary: { zh: summary, en: summary, ja: summary },
        audience: { zh: audience, en: audience, ja: audience },
        why: { zh: why, en: why, ja: why },
        verdict: { zh: verdict, en: verdict, ja: verdict },
        tags,
        pros,
        cons,
        rank,
        sentiment,
        recommendationLevel
      };
    }
    function findMajor(id) { return categoryTree.find(item => item.id === id); }
    function findSub(majorId, subId) { return findMajor(majorId)?.children.find(item => item.id === subId); }
    function findLeaf(majorId, subId, leafId) { return findSub(majorId, subId)?.children.find(item => item.id === leafId); }
    function setView(next) {
      state = { ...state, ...next };
      render();
    }
    function renderI18n() {
      document.documentElement.lang = state.lang === "zh" ? "zh-CN" : state.lang;
      document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = tr(el.dataset.i18n); });
      $("searchInput").placeholder = tr("searchPlaceholder");
      document.querySelectorAll("[data-lang]").forEach(btn => btn.classList.toggle("active", btn.dataset.lang === state.lang));
      localStorage.setItem("hangrank-language", state.lang);
    }
    function renderBreadcrumbs() {
      const major = findMajor(state.majorId);
      const sub = findSub(state.majorId, state.subId);
      const leaf = findLeaf(state.majorId, state.subId, state.leafId);
      const parts = [`<button type="button" data-crumb="home">${tr("home")}</button>`];
      if (major) parts.push("›", `<button type="button" data-crumb="major">${label(major)}</button>`);
      if (sub) parts.push("›", `<button type="button" data-crumb="sub">${label(sub)}</button>`);
      if (leaf) parts.push("›", `<span>${label(leaf)}</span>`);
      $("breadcrumbs").innerHTML = parts.join("");
      document.querySelectorAll("[data-crumb]").forEach(btn => {
        btn.onclick = () => {
          if (btn.dataset.crumb === "home") setView({ view: "home", majorId: null, subId: null, leafId: null, query: "" });
          if (btn.dataset.crumb === "major") setView({ view: "level2", subId: null, leafId: null });
          if (btn.dataset.crumb === "sub") setView({ view: "level3", leafId: null });
        };
      });
    }
    function currentTitle() {
      if (state.view === "favorites") return tr("favoriteResults");
      if (state.query && state.view !== "ranking") return tr("searchResults");
      if (state.view === "level2") return label(findMajor(state.majorId));
      if (state.view === "level3") return label(findSub(state.majorId, state.subId));
      if (state.view === "ranking") return label(findLeaf(state.majorId, state.subId, state.leafId));
      return tr("allCategories");
    }
    function currentHint() {
      if (state.view === "level2") return tr("subcategories");
      if (state.view === "level3") return tr("leafCategories");
      if (state.view === "ranking") return tr("ranking");
      if (state.view === "favorites") return tr("favoriteResults");
      return tr("chooseMajor");
    }
    function searchMatchesNode(item) {
      const q = state.query.trim().toLowerCase();
      if (!q) return true;
      return [item.labels.zh, item.labels.en, item.labels.ja, item.description?.zh, item.slug].join(" ").toLowerCase().includes(q);
    }
    function getTargetForNode(item) {
      if (item.level === 1) return { view: "level2", majorId: item.id, subId: null, leafId: null };
      if (item.level === 2) return { view: "level3", majorId: item.parentId, subId: item.id, leafId: null };
      const sub = findSubById(item.parentId);
      return { view: "ranking", majorId: sub?.parentId || null, subId: item.parentId, leafId: item.id };
    }
    function findSubById(subId) {
      for (const major of categoryTree) {
        const sub = major.children.find(item => item.id === subId);
        if (sub) return sub;
      }
      return null;
    }
    function countProductsForTarget(target) {
      if (target.view === "level2") {
        const actual = products.filter(product => product.category === target.majorId).length;
        const major = findMajor(target.majorId);
        const recommended = major?.children.reduce((sum, sub) => sum + sub.children.reduce((leafSum, leaf) => leafSum + (leaf.recommendedItems || 0), 0), 0) || 0;
        return actual || recommended;
      }
      if (target.view === "level3") {
        const actual = products.filter(product => product.subcategory === target.subId).length;
        const sub = findSub(target.majorId, target.subId);
        const recommended = sub?.children.reduce((sum, leaf) => sum + (leaf.recommendedItems || 0), 0) || 0;
        return actual || recommended;
      }
      if (target.view === "ranking") {
        const actual = products.filter(product => product.leafCategory === target.leafId).length;
        const leaf = findLeaf(target.majorId, target.subId, target.leafId);
        return actual || leaf?.recommendedItems || 0;
      }
      return products.length;
    }
    function renderDirectory() {
      let nodes = categoryTree;
      if (state.query && state.view !== "ranking" && state.view !== "favorites") {
        const flat = [];
        categoryTree.forEach(major => {
          if (searchMatchesNode(major)) flat.push(major);
          major.children.forEach(sub => {
            if (searchMatchesNode(sub)) flat.push(sub);
            sub.children.forEach(leaf => {
              if (searchMatchesNode(leaf)) flat.push(leaf);
            });
          });
        });
        nodes = flat;
      } else if (state.view === "level2") {
        nodes = findMajor(state.majorId)?.children || [];
      } else if (state.view === "level3") {
        nodes = findSub(state.majorId, state.subId)?.children || [];
      } else if (state.view === "ranking" || state.view === "favorites") {
        nodes = [];
      }
      $("directoryGrid").style.display = nodes.length ? "grid" : "none";
      $("directoryGrid").innerHTML = nodes.map(item => {
        const target = getTargetForNode(item);
        return `
          <button class="directory-card" type="button" data-target='${JSON.stringify(target)}'>
            <span class="icon">${label(item).slice(0, 1)}</span>
            <strong>${label(item)}</strong>
            <p>${description(item)}</p>
            <small>${countProductsForTarget(target)} ${tr("items")}</small>
          </button>
        `;
      }).join("");
      document.querySelectorAll("[data-target]").forEach(card => {
        card.onclick = () => setView(JSON.parse(card.dataset.target));
      });
    }
    function searchableTextForProduct(product) {
      const major = findMajor(product.category);
      const sub = findSub(product.category, product.subcategory);
      const leaf = findLeaf(product.category, product.subcategory, product.leafCategory);
      return [product.brand, product.model, product.name.zh, product.name.en, product.name.ja, product.summary.zh, label(major), label(sub), label(leaf)].join(" ").toLowerCase();
    }
    function matchingProducts() {
      let list = products.slice();
      if (state.view === "ranking" && state.leafId) list = list.filter(product => product.leafCategory === state.leafId);
      if (state.view === "favorites") list = list.filter(product => favorites.includes(product.id));
      if (state.query.trim()) {
        const q = state.query.trim().toLowerCase();
        list = list.filter(product => searchableTextForProduct(product).includes(q));
      }
      return list;
    }
    function renderProducts() {
      const showProducts = state.view === "ranking" || state.view === "favorites" || (state.query && matchingProducts().length);
      const list = showProducts ? matchingProducts().sort((a, b) => (a.rank || 999) - (b.rank || 999)) : [];
      $("tierContainer").style.display = list.length ? "block" : "none";
      $("tierContainer").innerHTML = tierOrder.map(tier => {
        const tierProducts = list.filter(product => product.tier === tier);
        if (!tierProducts.length) return "";
        return `
          <section class="tier">
            <div class="tier-top"><h3>${tiers[tier][state.lang]}</h3><span class="tier-count">${tierProducts.length} ${tr("items")}</span></div>
            <div class="product-grid">${tierProducts.map(renderProductCard).join("")}</div>
          </section>
        `;
      }).join("");
      const hasDirectory = $("directoryGrid").style.display !== "none";
      const empty = (state.view === "ranking" || state.view === "favorites" || state.query) && !list.length && !hasDirectory;
      $("emptyState").style.display = empty ? "block" : "none";
      $("emptyState").textContent = state.view === "favorites" ? tr("favoriteEmpty") : tr("empty");
      document.querySelectorAll("[data-product]").forEach(card => card.onclick = () => openProduct(card.dataset.product));
      document.querySelectorAll("[data-fav]").forEach(btn => {
        btn.onclick = event => {
          event.stopPropagation();
          toggleFavorite(btn.dataset.fav);
        };
      });
    }
    function renderProductCard(product) {
      return `
        <article class="card ${product.tier}" data-product="${product.id}">
          <div class="rail"></div>
          <div class="card-head">
            <div>
              <span class="badge">${tiers[product.tier][state.lang]}</span>
              <div class="meta">${product.brand} / ${product.model}</div>
              <div class="name">${product.name[state.lang]}</div>
            </div>
            <button class="heart ${favorites.includes(product.id) ? "active" : ""}" type="button" data-fav="${product.id}">♥</button>
          </div>
          <p class="summary">${product.summary[state.lang]}</p>
          <div class="score-row">
            <div class="score">${product.score}</div>
            <div>${meter(tr("value"), product.valueScore)}${meter(tr("quality"), product.qualityScore)}</div>
          </div>
          <div class="quick-notes">
            <div class="quick-note"><strong>${tr("pros")}</strong>${product.pros.slice(0, 2).join(" / ")}</div>
            <div class="quick-note"><strong>${tr("cons")}</strong>${product.cons.slice(0, 2).join(" / ")}</div>
          </div>
          <div class="audience-label">${tr("audience")}</div>
          <div class="audience">${product.audience[state.lang]}</div>
          <div class="tags">${product.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}</div>
          <div class="detail-link"><span>${tr("detail")}</span><span>↗</span></div>
        </article>
      `;
    }
    function meter(name, value) {
      return `<div class="meter"><div class="meter-label"><span>${name}</span><span>${value}</span></div><div class="bar"><div class="fill" style="width:${value}%"></div></div></div>`;
    }
    function toggleFavorite(id) {
      favorites = favorites.includes(id) ? favorites.filter(item => item !== id) : favorites.concat(id);
      localStorage.setItem("hangrank-favorites-static", JSON.stringify(favorites));
      render();
    }
    function openProduct(id) {
      const product = products.find(item => item.id === id);
      if (!product) return;
      const leaf = findLeaf(product.category, product.subcategory, product.leafCategory);
      $("modal").classList.add("show");
      $("modalTier").className = `badge ${product.tier}`;
      $("modalTier").textContent = tiers[product.tier][state.lang];
      $("modalTitle").textContent = product.name[state.lang];
      $("modalSummary").textContent = product.summary[state.lang];
      $("modalInfo").textContent = `${product.brand} / ${product.model} / ${label(leaf)} / ${product.score}`;
      $("modalWhy").textContent = product.why[state.lang];
      $("modalAudience").textContent = product.audience[state.lang];
      $("modalPros").innerHTML = product.pros.map(item => `<li>${item}</li>`).join("");
      $("modalCons").innerHTML = product.cons.map(item => `<li>${item}</li>`).join("");
      $("modalVerdict").textContent = product.verdict[state.lang];
    }
    function render() {
      renderI18n();
      renderBreadcrumbs();
      $("viewTitle").textContent = currentTitle();
      $("viewHint").textContent = currentHint();
      $("hero").style.display = state.view === "home" && !state.query ? "block" : "none";
      $("searchInput").value = state.query;
      $("clearButton").style.display = state.query ? "block" : "none";
      renderDirectory();
      renderProducts();
    }
    $("homeButton").onclick = () => setView({ view: "home", majorId: null, subId: null, leafId: null, query: "" });
    $("directoryButton").onclick = () => setView({ view: "home", majorId: null, subId: null, leafId: null, query: "" });
    $("favoritesButton").onclick = () => setView({ view: "favorites", majorId: null, subId: null, leafId: null, query: "" });
    $("searchInput").oninput = event => setView({ query: event.target.value });
    $("clearButton").onclick = () => setView({ query: "" });
    $("modalClose").onclick = () => $("modal").classList.remove("show");
    $("modal").onclick = event => { if (event.target.id === "modal") $("modal").classList.remove("show"); };
    document.querySelectorAll("[data-lang]").forEach(btn => btn.onclick = () => setView({ lang: btn.dataset.lang }));

    render();
  </script>
</body>
</html>
